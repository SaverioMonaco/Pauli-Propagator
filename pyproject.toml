[project]
name = "Pauli-Propagation"
version = "3.0.0"
authors = [{ name = "Saverio Monaco", email = "saverio.monaco@desy.de" }]
description = "A Pennylane-based toolkit for approximate symbolic Pauli propagation and evaluation of quantum circuit observables."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pennylane==0.42.3",
    "sympy>=1.14.0",
    "jax==0.5.0",
    "jaxlib==0.5.0",
    "optax==0.2.4",
    "matplotlib==3.11.1",
]

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pprop"]

[project.optional-dependencies]
dev = ["sphinx>=7", "furo", "myst-parser"]
notebooks = ["matplotlib>=3.10.3", "ipykernel>=6.29.5"]
scripts = ["wandb>=0.19", "pillow", "qiskit", "qiskit-ibm-runtime"]
