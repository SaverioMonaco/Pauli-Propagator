[package]
name = "pprop_rs"
version = "0.2.0"
edition = "2021"

[lib]
name = "pprop_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
rustc-hash = "2.0"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
